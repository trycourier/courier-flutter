name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_from_tag:
        description: "Run publish steps (must be a tag ref)"
        required: false
        default: "false"

jobs:
  tag-and-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Tag and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version
        id: check
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping deploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist. Deploying."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CHANGELOG.md
        if: steps.check.outputs.deployed == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          echo "" > CHANGELOG.md

          # Previous release before version/tag $1, from commit $2. Starts from `git describe`,
          # but each release tag now sits on its CHANGELOG commit, which reaches main through a
          # PR and so isn't an ancestor of main if that PR was squashed. When the
          # next-lower-versioned tag is such a commit, use it instead.
          prev_tag() {
            local described by_version
            described=$(git describe --tags --abbrev=0 "$2" 2>/dev/null || true)
            by_version=$(
              { echo "$(echo "$1" | tr -cd '0-9.') ="
                git tag | while read -r t; do echo "$(echo "$t" | tr -cd '0-9.') $t"; done
              } | sort -s -V -k1,1 | awk '$2 == "=" { print p; exit } { p = $2 }'
            )
            if [ -n "$by_version" ] && ! git merge-base --is-ancestor "$by_version" "$2" \
              && git log -1 --format=%s "$by_version" | grep -q '^Update CHANGELOG.md for ' \
              && git merge-base --is-ancestor "$by_version^" "$2"; then
              echo "$by_version"
            else
              echo "${described:-$(git rev-list --max-parents=0 HEAD)}"
            fi
          }

          # The CHANGELOG commits themselves aren't release notes.
          entries() {
            git log "$1".."$2" --pretty=format:"- %s" --no-merges \
              --invert-grep --grep='^Update CHANGELOG.md for '
          }

          CURRENT_ENTRIES=$(entries "$(prev_tag "$VERSION" HEAD)" HEAD)
          echo "## $VERSION" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -n "$CURRENT_ENTRIES" ]; then
            echo "$CURRENT_ENTRIES" >> CHANGELOG.md
          else
            echo "- Release $VERSION" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

          for TAG in $(git tag --sort=-v:refname); do
            ENTRIES=$(entries "$(prev_tag "$TAG" "$TAG^")" "$TAG")
            echo "## $TAG" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            if [ -n "$ENTRIES" ]; then
              echo "$ENTRIES" >> CHANGELOG.md
            else
              echo "- Release $TAG" >> CHANGELOG.md
            fi
            echo "" >> CHANGELOG.md
          done

      # Committed locally, not pushed to main: main requires the iOS build check, which a
      # direct push can't satisfy. The release tag goes on this commit (so the pub.dev package
      # carries the new CHANGELOG), and a PR brings it to main after publishing.
      - name: Commit CHANGELOG.md
        id: changelog
        if: steps.check.outputs.deployed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update CHANGELOG.md for ${{ steps.check.outputs.version }}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.check.outputs.deployed == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.check.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          TAG="v$VERSION"
          gh release create "$TAG" --generate-notes

      - name: Trigger publish
        if: steps.check.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          TAG="v$VERSION"
          gh workflow run deploy.yml --ref "$TAG" -f publish_from_tag=true

      - name: Open CHANGELOG pull request
        if: steps.check.outputs.deployed == 'true' && steps.changelog.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          BRANCH="changelog/v$VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Update CHANGELOG.md for $VERSION" \
            --body "Opened by the Deploy workflow. v$VERSION is tagged on this commit and already published; merging brings CHANGELOG.md onto main. Any merge method works."
          # PRs opened with GITHUB_TOKEN don't trigger workflows, so start CI on the branch to
          # produce the checks main requires.
          gh workflow run ci.yml --ref "$BRANCH"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish_from_tag == 'true'
    name: Publish to pub.dev
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
